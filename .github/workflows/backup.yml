name: Supabase Database Backup

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Create database backup
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          mkdir -p backup

          docker run --rm \
            -e PGPASSWORD \
            -e PGSSLMODE \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_dump \
              --host=aws-0-ap-southeast-2.pooler.supabase.com \
              --port=5432 \
              --username=postgres.prclegyertbdwfsjrvix \
              --dbname=postgres \
              --format=custom \
              --file=/backup/financial-tracker-$(date +%Y-%m-%d).dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: financial-tracker-backup
          path: backup/
          retention-days: 30